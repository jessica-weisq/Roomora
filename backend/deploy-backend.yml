# Tests the backend, then deploys it to Modal, on every push to main that touches backend/.
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   MODAL_TOKEN_ID and MODAL_TOKEN_SECRET  (create a token at https://modal.com/settings/tokens)
# and, once, a Modal secret with the API keys:
#   modal secret create photos-to-3d GEMINI_API_KEY=... [FAL_KEY=...]
name: Deploy backend

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/deploy-backend.yml"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r backend/requirements-local.txt
      - run: python -m pytest backend/tests -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install modal
      - run: modal deploy backend/app.py
